name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ubuntu-latest
      flake-check: false
      fmt: true
      clippy: true
      clippy-command: cargo clippy --locked --all-targets -- -D warnings
      test: true
      test-command: cargo test --locked --all-features

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ${{ matrix.os }}
      flake-check-command: nix flake check --no-build
      build: true
      build-command: nix build -L --no-link
      cache: true
      cache-save: true

  musl:
    name: Build (musl)
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      flake-check: false
      build: true
      build-command: |
        nix build .#nixos-core-musl -L
        file result/bin/nixos-core | grep -q ld-musl

  vm-tests:
    name: List VM Tests
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - id: list
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  vm-test:
    name: ${{ matrix.check }}
    needs: [vm-tests, build]
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.vm-tests.outputs.checks) }}
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      flake-check: false
      build: true
      build-command: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
      cache: true

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - build
      - musl
      - vm-tests
      - vm-test
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
